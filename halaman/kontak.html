<section id="kontak" class="kontak">
  <h2>Hubungi Saya</h2>
  <div class="sosmed">
    <h3>Sosial Media</h3>
    <div class="list-sosmed">
      <span class="icon link">
        <svg>
          <use id="li" class="li" href="media/icon/icons.svg#linkedin" />
        </svg>
        <a href="">LinkedIn</a>
      </span>
      <span class="icon git">
        <svg>
          <use class="git" href="media/icon/icons.svg#github" />
        </svg>
        <a href="">github</a>
      </span>
    </div>
  </div>
  <form>
    <h3>Form Chat</h3>
    <label for="nama">Nama Anda</label>
    <input
      type="text"
      name="nama"
      id="nama"
      placeholder=" Nama Anda"
      value=""
    />
    <label for="email">Email Anda</label>
    <input
      type="email"
      name="email"
      id="email"
      placeholder=" Emailanda@email.com"
      value=""
    />
    <label for="pesan">Pesan Anda</label>
    <textarea name="pesan" id="pesan" rows="5" cols="20"></textarea>
    <div class="tombol">
      <button id="whatsapp">WhatsApp</button>
      <button id="kirim">Kirim</button>
    </div>
  </form>
</section>
