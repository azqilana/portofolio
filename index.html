<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azqilana</title>
    <link rel="icon" href="./media/favicon.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style id="global-style">
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #1a1a2e;
        --bg-card: #22223b;
        --bg-input: #2a2a40;
        --text: #f0f0f0;
        --text-muted: #a0a0b0;
        --accent-blue: #4361ee;
        --accent-green: #4ade80;
        --border: #33334a;
        --navbar-h: 64px;
      }
      body.light {
        --bg: #f0f4ff;
        --bg-card: #ffffff;
        --bg-input: #e8edf5;
        --text: #1a1a2e;
        --text-muted: #555577;
        --border: #d0d4e8;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
      }

      /* NAVBAR */
      .navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        height: var(--navbar-h);
        background: var(--bg-card);
        border-bottom: 1px solid var(--border);
      }
      .nav-menu-btn {
        background: var(--bg-input);
        border: none;
        color: var(--text);
        font-size: 1.3rem;
        width: 42px;
        height: 42px;
        border-radius: 10px;
        cursor: pointer;
      }
      .nav-title {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text);
      }
      .nav-theme-btn {
        background: var(--bg-input);
        border: none;
        color: var(--text);
        font-size: 0.85rem;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 500;
      }

      /* SIDEBAR */
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 200;
      }
      .sidebar-overlay.active { display: block; }
      .sidebar {
        position: fixed;
        top: 0;
        left: -260px;
        width: 240px;
        height: 100vh;
        background: var(--bg-card);
        z-index: 300;
        padding: 32px 20px;
        transition: left 0.3s ease;
        border-right: 1px solid var(--border);
      }
      .sidebar.active { left: 0; }
      .sidebar ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 24px;
      }
      .sidebar ul li a {
        display: block;
        padding: 12px 16px;
        color: var(--text);
        text-decoration: none;
        border-radius: 10px;
        font-weight: 500;
        transition: background 0.2s;
      }
      .sidebar ul li a:hover { background: var(--bg-input); }
      .sidebar ul li a.active-link {
        background: var(--accent-blue);
        color: #fff;
      }
    </style>
    <style id="page-style"></style>
  </head>
  <body>

    <!-- NAVBAR -->
    <nav class="navbar">
      <button class="nav-menu-btn" id="menuBtn">&#9776;</button>
      <span class="nav-title">Azqilana</span>
      <button class="nav-theme-btn" id="themeBtn">Terang</button>
    </nav>

    <!-- SIDEBAR -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
      <ul>
        <li><a href="/" id="nav-beranda">Beranda</a></li>
        <li><a href="/skill" id="nav-skill">Skill</a></li>
        <li><a href="/karya" id="nav-karya">Karya</a></li>
        <li><a href="/kontak" id="nav-kontak">Kontak</a></li>
      </ul>
    </div>

    <main id="main-go"></main>

    <script type="module" src="./index.js"></script>
    <script>
      // Theme toggle (global, tidak bergantung module)
      document.addEventListener('DOMContentLoaded', () => {
        const themeBtn = document.getElementById('themeBtn');
        let isLight = false;
        themeBtn.addEventListener('click', () => {
          isLight = !isLight;
          document.body.classList.toggle('light', isLight);
          themeBtn.textContent = isLight ? 'Gelap' : 'Terang';
        });

        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        menuBtn.addEventListener('click', () => {
          sidebar.classList.add('active');
          overlay.classList.add('active');
        });
        overlay.addEventListener('click', () => {
          sidebar.classList.remove('active');
          overlay.classList.remove('active');
        });
        document.querySelectorAll('.sidebar a').forEach(link => {
          link.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
          });
        });
      });

      // Highlight active nav
      function setActiveNav() {
        const path = window.location.pathname;
        const map = { '/': 'nav-beranda', '/skill': 'nav-skill', '/karya': 'nav-karya', '/kontak': 'nav-kontak' };
        document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active-link'));
        const id = map[path];
        if (id) document.getElementById(id)?.classList.add('active-link');
      }
      window.addEventListener('popstate', setActiveNav);
      document.addEventListener('DOMContentLoaded', setActiveNav);
    </script>
  </body>
</html>
